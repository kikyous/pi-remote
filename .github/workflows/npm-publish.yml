name: npm-publish.yml

# Publish pi-remote-server to npm:
#   - on any v* tag push (e.g. `git tag v0.2.0 && git push origin v0.2.0`)
#   - manually from the Actions tab
#
# The tag version becomes the published package version (package.json is
# bumped in place, nothing is committed).
#
# Publishing uses npm Trusted Publishing (OIDC) — the npm package settings
# must map this workflow file (kikyous/pi-remote → .github/workflows/npm-publish.yml)
# to the pi-remote-bridge package. No NPM_TOKEN secret needed, no 2FA prompt.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Needed for npm Trusted Publishing: npm fetches a GitHub OIDC token
      # and exchanges it with the registry to authenticate the publish.
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Tag pushes sync the version to the tag (v0.2.0 → 0.2.0). Manual
      # workflow_dispatch runs skip this and publish the version already in
      # package.json (GITHUB_REF_NAME is a branch name, not a version).
      - name: Sync package version with git tag
        if: github.ref_type == 'tag'
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # TEMP DIAGNOSIS: print the OIDC claims npm matches against, so a 404
      # from trusted publishing can be traced to the exact mismatching field.
      - name: Debug OIDC claims
        run: |
          echo "== npmrc =="
          cat "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}" 2>/dev/null | sed 's/_authToken=.*/_authToken=<masked>/'
          echo "== OIDC claims =="
          TOKEN=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{aud, ref, sha, repository, repository_owner, job_workflow_ref, workflow, environment, actor, run_attempt}'

      - name: Publish to npm
        # --provenance triggers npm's OIDC trusted-publishing flow: npm fetches
        # a GitHub OIDC token and authenticates to the registry with it (no
        # NODE_AUTH_TOKEN on purpose — a stray token would take precedence).
        run: npm publish --provenance --loglevel verbose
