name: Build Android APK

# Builds the Android app on every push / PR and on demand:
#   - debug APK is uploaded as a workflow artifact
#   - on v* tag pushes the APK is also attached to the GitHub Release
#
# Release signing is not configured yet; the artifact is the debug-signed APK
# (installable on any device). To ship signed releases, add KEYSTORE_* secrets
# and a signingConfig in android/app/build.gradle.kts.

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-remote-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Attach the APK to the GitHub Release when a version tag is pushed.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pi-remote-debug-apk
          path: apk

      - uses: softprops/action-gh-release@v2
        with:
          files: apk/**/*.apk
