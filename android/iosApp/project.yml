name: iosApp
options:
  bundleIdPrefix: com.piremote
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 45RMTN4VYV
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    # Xcode's SwiftUI preview links a __preview.dylib that fails on Intel Macs;
    # the preview is useless for this Compose app anyway.
    ENABLE_PREVIEWS: NO
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Pi Remote CMP
        UILaunchScreen: {}
        # Required by Compose Multiplatform's PlistSanityCheck (crashes at
        # startup with an IllegalStateException if missing).
        CADisableMinimumFrameDurationOnPhone: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Scan-to-connect is v2 on iOS; the camera permission is declared now so
        # adding the AVFoundation scanner later needs no store review dance.
        NSCameraUsageDescription: Scans the QR code printed by pi-remote-server on your PC to connect.
        # iOS 14+ local-network privacy: connecting to pi-remote-server over
        # the LAN (http://192.168.x.x) is blocked without this prompt.
        NSLocalNetworkUsageDescription: Connects to pi-remote-server running on your PC over the local network.
        # The bridge is plain http on the LAN; iOS ATS blocks cleartext by
        # default, so opt local networking out (LAN traffic only, never the WAN).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.piremote.cmp.ios
        PRODUCT_NAME: PiRemoteCMP
        TARGETED_DEVICE_FAMILY: "1"
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework PiRemote
        # The Kotlin Gradle script phase writes into the build dir; the
        # default sandbox would block it.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Compile Kotlin framework
        script: |
          cd "$SRCROOT/.."
          # Xcode's script environment has no Java on PATH; the Kotlin gradle
          # build needs a JDK (this machine: JDK 17 under ~/tools).
          export JAVA_HOME="/Users/chen/tools/jdk-17.0.20+8/Contents/Home"
          export PATH="$JAVA_HOME/bin:$PATH"
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
