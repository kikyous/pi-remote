org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# AGP 8.x needs a JDK 17 daemon. The JDK is selected via the JAVA_HOME
# environment variable (see ~/.zshrc on this machine / setup-java on CI);
# do NOT pin org.gradle.java.home here — it breaks on other machines.

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# AGP 9 has built-in Kotlin by default, which conflicts with the classic
# kotlin-android plugin chain (compose/serialization). Keep the KGP path.
android.builtInKotlin=false
android.newDsl=false
