			shellPath = /bin/sh;
			shellScript = "cd \"$SRCROOT/..\"\n# Xcode script phases run without a login shell: java is not on PATH\n# and JAVA_HOME is unset. Resolve a JDK in order of preference:\n#   1. $JAVA_HOME if it points at a real JDK\n#   2. java on PATH (via /usr/libexec/java_home on macOS)\n#   3. $PIREMOTE_JAVA_HOME (explicit per-machine override)\n#   4. $HOME/tools/jdk-17.0.20+8/Contents/Home (this machine's JDK)\nif [ -z \"${JAVA_HOME:-}\" ] || [ ! -x \"$JAVA_HOME/bin/java\" ]; then\n  if command -v java >/dev/null 2>&1 && J=\"$(/usr/libexec/java_home 2>/dev/null)\" && [ -x \"$J/bin/java\" ]; then\n    export JAVA_HOME=\"$J\"\n  elif [ -n \"${PIREMOTE_JAVA_HOME:-}\" ] && [ -x \"$PIREMOTE_JAVA_HOME/bin/java\" ]; then\n    export JAVA_HOME=\"$PIREMOTE_JAVA_HOME\"\n  elif [ -x \"$HOME/tools/jdk-17.0.20+8/Contents/Home/bin/java\" ]; then\n    export JAVA_HOME=\"$HOME/tools/jdk-17.0.20+8/Contents/Home\"\n  else\n    echo \"error: no JDK found; set JAVA_HOME (or PIREMOTE_JAVA_HOME) to a JDK 17+\" >&2\n    exit 1\n  fi\nfi\nexport PATH=\"$JAVA_HOME/bin:$PATH\"\n./gradlew :composeApp:embedAndSignAppleFrameworkForXcode\n";
		};
