name: iosApp
options:
  bundleIdPrefix: com.piremote
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    # The cert label reads "Apple Development: kikyous@163.com (45RMTN4VYV)"
    # but that team id is misleading — the cert's real team (OU) is
    # 8QV6UFZ79P (see ios-build.md). Kept as the signing team here so
    # regenerating the project does not silently revert the hand-corrected
    # pbxproj.
    DEVELOPMENT_TEAM: 8QV6UFZ79P
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    # Xcode's SwiftUI preview links a __preview.dylib that fails on Intel Macs;
    # the preview is useless for this Compose app anyway.
    ENABLE_PREVIEWS: NO
targets:
  iosApp:
    type: application
    platform: iOS
    productName: PiRemoteCMP
    sources:
      - iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Pi Remote
        # CFBundleName shows under the icon too; keep it consistent so the
        # home-screen label is one word pair across platforms.
        CFBundleName: Pi Remote
        UILaunchScreen: {}
        # Required by Compose Multiplatform's PlistSanityCheck (crashes at
        # startup with an IllegalStateException if missing).
        CADisableMinimumFrameDurationOnPhone: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPhone-only apps installed on an iPad run in a phone-sized floating
        # window ("not full screen, very short"). Declare iPad as a target
        # family AND require full screen so it fills the whole display.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Scan-to-connect is v2 on iOS; the camera permission is declared now so
        # adding the AVFoundation scanner later needs no store review dance.
        NSCameraUsageDescription: Scans the QR code printed by pi-remote-server on your PC to connect.
        # iOS 14+ local-network privacy: connecting to pi-remote-server over
        # the LAN (http://192.168.x.x) is blocked without this prompt.
        NSLocalNetworkUsageDescription: Connects to pi-remote-server running on your PC over the local network.
        # The bridge is plain http on the LAN; iOS ATS blocks cleartext by
        # default, so opt local networking out (LAN traffic only, never the WAN).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.piremote.cmp.ios
        PRODUCT_NAME: PiRemoteCMP
        # iPhone + iPad; without the iPad family this app can only ever run as
        # a small compatibility window on an iPad.
        TARGETED_DEVICE_FAMILY: "1,2"
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework PiRemote
        # The Kotlin Gradle script phase writes into the build dir; the
        # default sandbox would block it.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Compile Kotlin framework
        script: |
          cd "$SRCROOT/.."
          # Xcode script phases run without a login shell: java is not on PATH
          # and JAVA_HOME is unset. Resolve a JDK in order of preference:
          #   1. $JAVA_HOME if it points at a real JDK
          #   2. java on PATH (via /usr/libexec/java_home on macOS)
          #   3. $PIREMOTE_JAVA_HOME (explicit per-machine override)
          #   4. $HOME/tools/jdk-17.0.20+8/Contents/Home (this machine's JDK)
          if [ -z "${JAVA_HOME:-}" ] || [ ! -x "$JAVA_HOME/bin/java" ]; then
            if command -v java >/dev/null 2>&1 && J="$(/usr/libexec/java_home 2>/dev/null)" && [ -x "$J/bin/java" ]; then
              export JAVA_HOME="$J"
            elif [ -n "${PIREMOTE_JAVA_HOME:-}" ] && [ -x "$PIREMOTE_JAVA_HOME/bin/java" ]; then
              export JAVA_HOME="$PIREMOTE_JAVA_HOME"
            elif [ -x "$HOME/tools/jdk-17.0.20+8/Contents/Home/bin/java" ]; then
              export JAVA_HOME="$HOME/tools/jdk-17.0.20+8/Contents/Home"
            else
              echo "error: no JDK found; set JAVA_HOME (or PIREMOTE_JAVA_HOME) to a JDK 17+" >&2
              exit 1
            fi
          fi
          export PATH="$JAVA_HOME/bin:$PATH"
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
